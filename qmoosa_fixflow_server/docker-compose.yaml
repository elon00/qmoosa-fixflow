services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: qmoosa_fixflow
      POSTGRES_PASSWORD: "bq65byzAK-OXv7fry_rUgLnPT7B-SNPF"
    volumes:
      - qmoosa_fixflow_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "WdwizDlp40NEA9oUmpXup0AJjivDFCm5"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: qmoosa_fixflow_test
      POSTGRES_PASSWORD: "H0_iiNkTmiLpx31_j3fPsSOXDfRC6i3F"
    volumes:
      - qmoosa_fixflow_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "nNuSu7DJ5sEyvS10liVZ9haQUmnv2WTt"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  qmoosa_fixflow_data:
  qmoosa_fixflow_test_data:
