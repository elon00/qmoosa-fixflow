name: Qmoosa FixFlow CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Workspace Dependencies
        run: flutter pub get

      - name: Check Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Serverpod Backend Analysis
        working-directory: qmoosa_fixflow_server
        run: dart analyze --fatal-infos

      - name: Flutter App Analysis
        working-directory: qmoosa_fixflow_flutter
        run: flutter analyze

      - name: Run Backend Unit Tests
        working-directory: qmoosa_fixflow_server
        run: dart test test/unit/state_machine_test.dart

      - name: Run Flutter Widget Tests
        working-directory: qmoosa_fixflow_flutter
        run: flutter test test/widget_test.dart
